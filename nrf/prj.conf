CONFIG_NCS_SAMPLES_DEFAULTS=y

# Sized via the per-model nrf_axon_model_current_model_.h asserts; 360000 leaves
# plenty of headroom for any of our mel-input models on the nRF54LM20B's 511 KB.
CONFIG_NRF_AXON=y
CONFIG_NRF_AXON_INTERLAYER_BUFFER_SIZE=360000
CONFIG_NRF_AXON_PSUM_BUFFER_SIZE=0

CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_MAIN_STACK_SIZE=4096

# Hardware FPU — without it the mel FFT/sqrtf/logf are soft-float (10-30x slower)
CONFIG_FPU=y

# CMSIS-DSP real FFT (arm_rfft_fast_f32) for the CPU mel preprocessing
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_TRANSFORM=y
